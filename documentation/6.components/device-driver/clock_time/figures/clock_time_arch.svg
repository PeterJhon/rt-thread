<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><defs><style>.box-upper{fill:#e8f4fd;stroke:#3b5998;stroke-width:1.5}.box-core,.box-source{fill:#fff8e6;stroke:#d9a300;stroke-width:1.5}.box-source{fill:#e6f7e6;stroke:#2e8b57}.box-event,.box-helper{fill:#ffe6e6;stroke:#c44536;stroke-width:1.5}.box-helper{fill:#f0e6ff;stroke:#7b4bb7}.box-bsp,.box-hw{fill:#e6f0f0;stroke:#4a7c7c;stroke-width:1.5}.box-hw{fill:#f5f5f5;stroke:#666}.text,.title{font-family:&apos;Segoe UI&apos;,Arial,sans-serif}.title{font-size:14px;font-weight:600;fill:#1a1a2e}.text{font-size:11px;fill:#4a4a4a}.layer{fill:#f8fafc;stroke:#3b5998;stroke-width:2;stroke-dasharray:none}.layer-title{font-family:&apos;Segoe UI&apos;,Arial,sans-serif;font-size:16px;font-weight:700;fill:#3b5998}.arrow{stroke:#5c6b7a;stroke-width:1.5;fill:none}</style><marker id="arrowhead" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#5c6b7a" points="0 0 8 3 0 6"/></marker></defs><rect width="240" height="65" x="50" y="20" class="box-upper" rx="8" ry="8"/><text x="170" y="45" class="title" text-anchor="middle">POSIX / libc</text><text x="170" y="62" class="text" text-anchor="middle">clock_gettime, nanosleep</text><rect width="240" height="65" x="330" y="20" class="box-upper" rx="8" ry="8"/><text x="450" y="45" class="title" text-anchor="middle">Soft RTC</text><text x="450" y="62" class="text" text-anchor="middle">timekeeping baseline</text><rect width="240" height="65" x="610" y="20" class="box-upper" rx="8" ry="8"/><text x="730" y="45" class="title" text-anchor="middle">Device Drivers</text><text x="730" y="62" class="text" text-anchor="middle">input timestamp, vDSO, PIC</text><rect width="820" height="300" x="40" y="115" class="layer" rx="12" ry="12"/><text x="60" y="142" class="layer-title">Clock Time Subsystem</text><rect width="200" height="80" x="80" y="165" class="box-core" rx="6" ry="6"/><text x="180" y="195" class="title" text-anchor="middle">Core API<